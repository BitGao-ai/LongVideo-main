# Unified data-pipeline config, read by data_pipeline/src/*.py; CLI flags override fields.

# ---------------- Paths ----------------
paths:
  data_root: data
  raw_videos: data/raw_videos
  filtered: data/filtered.jsonl
  rejected: data/rejected.jsonl
  features: data/features             # .npz (small scale)
  features_npy: data/features_npy     # .npy + .ts.npy (large scale, true mmap)
  manifests: data/manifests
  stats: data/stats

# ---------------- (A) Filtering ----------------
filter:
  min_duration_s: 60.0                # Stage-1 floor; use 15.0 for stage-2
  max_duration_s: 10800.0             # 3h cap; split longer videos first
  min_short_side_px: 240
  black_frame_var_thresh: 8.0         # Below this pixel variance counts as black/flat
  static_absdiff_thresh: 2.0          # Below this frame diff counts as static
  static_ratio_reject: 0.9            # Reject above this static share (stage-2)
  keep_static_ratio: 0.10             # Low-motion positives kept for stage-1
  max_cuts_per_min: 40                # Scene-cut density cap
  dedup_phash_bits: 64
  dedup_hamming_thresh: 6             # Below this Hamming distance counts as duplicate
  holdout_hashes: null                # Eval-set pHash pickle; hits are rejected

# ---------------- (B) Sampling ----------------
sampler:
  strategy: adaptive                  # uniform | adaptive | scene
  coarse_fps: 4.0
  saliency: absdiff                   # absdiff | flow (flow is slower)
  theta: 0.12                         # Cumulative saliency trigger (smaller is denser)
  dt_min_s: 0.2                       # Min frame gap (caps rate on dynamic segments)
  dt_max_s: 2.0                       # Max frame gap (static-segment fallback)
  max_frames: 8192                    # Upper bound, not a target; must match DataConfig.max_frames

# ---------------- (B) Feature extraction ----------------
extract:
  model: Qwen/Qwen3-VL-4B-Instruct
  out_hidden: 2560                    # Measured Qwen3-VL-4B visual output dim
  patches: 9                          # Spatial pooling target P: 1 / 9 / 64
  dtype: float16
  chunk_frames: 64                    # Visual-tower chunk size against OOM
  skip_existing: true                 # Resume without re-extracting
  shard: null                         # "i/N" multi-machine sharding

# ---------------- (C) Manifest building ----------------
manifest:
  placeholder_mode: single            # single (recommended) | expand
  video_token: "<video>"
  default_task: qa
  grounding_ms_precision: true        # Keep millisecond precision on grounding labels

# ---------------- Sampling ratios ----------------
sampling:
  stage1:
    duration_bucket_weights: {"<1m": 1.0, "1-5m": 1.5, "5-15m": 2.0, "15-45m": 3.0, ">45m": 4.0}
    density_ratio: {low: 0.3, mid: 0.5, high: 0.2}
  stage2:
    min_grounding_ratio: 0.15

# ---------------- (D) Validation ----------------
validate:
  strict: true                        # Any hard failure exits nonzero
  check_monotonic_ts: true
  check_placeholder_align: true
  check_dim_consistency: true
  check_ref_reachable: true
  warn_constant_dt: true              # Warn when dt degrades to constant
  feat_dim: null                      # null = infer from features (recommended)
