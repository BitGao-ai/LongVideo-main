# CST-SSM default config (small; runs on CPU; scale up for production).
model:
  input_mode: feature        # feature | pixel
  feat_dim: 768              # Overwritten by align_feat_dim when data.manifest is set.
  d_model: 384               # Temporal width; production 768/1024.
  gate_init_eps: 0.1
  eacs_chunk: 32             # EACS chunked checkpoint size; 0 disables.
  pretrain_horizon: 1
  branches:                  # Short/sec, mid/min, long/hour scales.
    - {name: short, n_state: 16, tau_min: 0.1,  tau_max: 1.0,    imag_scale: 1.0}
    - {name: mid,   n_state: 32, tau_min: 10.0, tau_max: 60.0,   imag_scale: 0.3}
    - {name: long,  n_state: 64, tau_min: 600.0, tau_max: 3600.0, imag_scale: 0.1}
  llm:
    # Active only without --base-model (stand-in pipeline check, not production).
    # With --base-model Qwen/Qwen3-VL-4B-Instruct, vocab/dim come from the base.
    vocab_size: 259
    dim: 512
    n_layer: 6
    n_head: 8
    cross_every: 2
    max_len: 8704            # Must cover data.max_text_len.
    grad_checkpoint: true    # Per-layer checkpoint for the LLM segment.
    loss_chunk: 1024         # Chunked LM loss over (B,T,V); 0 disables.

train:
  stage: finetune            # finetune | pretrain
  lr: 1.0e-4
  weight_decay: 0.05
  grad_accum: 4
  max_steps: 1000            # Counts micro-batches, not optimizer steps.
  grad_clip: 1.0
  bf16: true
  eacs_chunk: 32
  t_start: 1.0
  t_end: 0.05
  ckpt_dir: checkpoints
  ckpt_every: 500
  save_trainable_only: null  # null = auto (true when frozen weights are recoverable).
  seed: 0                    # Base seed; each rank adds its rank offset.
  # Single-node multi-GPU (torchrun). Must be true under torchrun; CLI --ddp wins.
  # Use --device cuda (no index) so each rank binds its own GPU.
  ddp: false
  ddp_backend: nccl          # nccl (GPU) | gloo (CPU smoke test)

loss:
  task: 1.0
  pred: 0.5
  update_rate: 0.1
  spectral: 0.05

data:
  manifest: null
  val_manifest: null
  data_root: ""
  mode: feature              # feature | pixel
  max_frames: 8192
  max_text_len: 8704
  feat_dtype: auto           # auto | float16 | bfloat16 | float32
  batch_size: 2
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  drop_last: false
  length_bucketing: true     # Groups similar lengths; carries its own DDP sharding.
  bucket_multiplier: 32
  seed: 0
